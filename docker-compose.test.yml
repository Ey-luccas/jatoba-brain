services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: jatoba_test
      POSTGRES_USER: jatoba
      POSTGRES_PASSWORD: ${JATOBA_TEST_PASSWORD:?Test runner supplies a disposable password}
    ports:
      - "127.0.0.1:${JATOBA_TEST_DB_PORT:-0}:5432"
    volumes:
      - test_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U jatoba -d jatoba_test"]
      interval: 1s
      timeout: 3s
      retries: 40
  brain:
    image: jatoba-brain:integration-review
    build: .
    environment:
      DATABASE_URL: postgresql://jatoba:${JATOBA_TEST_PASSWORD}@postgres:5432/jatoba_test
      BRAIN_API_KEY: ${JATOBA_TEST_API_KEY:?Test runner supplies an ephemeral key}
      ALLOWED_HOSTS: 127.0.0.1,localhost
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      GRAPHIFY_BIN: ${GRAPHIFY_BIN:-graphify}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-250}
      EMBEDDING_HEALTH_TTL_MS: ${EMBEDDING_HEALTH_TTL_MS:-1000}
      EMBEDDING_HEALTH_TIMEOUT_MS: ${EMBEDDING_HEALTH_TIMEOUT_MS:-250}
      WORKSPACE_DIR: /workspace
      GRAPH_DIR: /app/graphs
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_MCP_MAX: ${RATE_LIMIT_MCP_MAX:-60}
      RATE_LIMIT_HEALTH_MAX: ${RATE_LIMIT_HEALTH_MAX:-300}
    ports:
      - "127.0.0.1::3338"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      embedding-test-provider:
        condition: service_started
  embedding-test-provider:
    image: node:20-alpine
    command: ["node", "/provider.mjs"]
    volumes:
      - ./scripts/embedding-test-provider.mjs:/provider.mjs:ro
    expose:
      - "4010"
volumes:
  test_postgres:
